<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent 任务台</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var t = localStorage.getItem("agent_browser_theme") || "system";
        var isDark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- 全局设置：外观与模型服务 -->
    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <div class="modal-head">
          <h2>设置</h2>
          <button type="button" class="icon-btn" id="close-settings" aria-label="关闭" title="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>

        <div class="modal-body">
          <section class="modal-section">
            <div class="modal-section-title">外观</div>
            <div class="segmented segmented-block" id="theme-segmented">
              <button type="button" class="segmented-btn" data-theme-val="light">浅色</button>
              <button type="button" class="segmented-btn" data-theme-val="dark">深色</button>
              <button type="button" class="segmented-btn" data-theme-val="system">跟随系统</button>
            </div>
          </section>

          <div class="divider"></div>

          <section class="modal-section">
            <div class="modal-section-title">模型服务</div>

            <div class="field">
              <label for="provider">服务类型</label>
              <select id="provider">
                <option value="anthropic">Anthropic（Claude 官方及兼容接口）</option>
                <option value="openai-compatible">OpenAI 兼容接口（含本地 Ollama / vLLM / Qwen / DeepSeek）</option>
              </select>
            </div>

            <div class="field">
              <label for="base-url">接口地址</label>
              <input id="base-url" type="url" placeholder="留空使用官方默认" />
              <p class="field-hint" id="base-url-hint"></p>
            </div>

            <div class="field">
              <label for="api-key">API Key</label>
              <input id="api-key" type="password" autocomplete="off" placeholder="留空则保持不变" />
              <label class="check"><input id="clear-key" type="checkbox" /> 清除已保存的密钥</label>
              <p class="field-hint" id="cred-hint"></p>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="model">主模型</label>
                <input id="model" class="mono" type="text" required placeholder="如 claude-opus-5-5 / gpt-5" />
              </div>
              <div class="field">
                <label for="find-model">元素定位模型</label>
                <input id="find-model" class="mono" type="text" placeholder="留空使用默认" />
                <p class="field-hint">find 工具用的小模型</p>
              </div>
            </div>

            <div class="field-row">
              <div class="field" id="effort-row">
                <label for="effort">思考强度</label>
                <select id="effort">
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high" selected>high</option>
                  <option value="xhigh">xhigh</option>
                  <option value="max">max</option>
                </select>
              </div>
              <div class="field" id="vision-row">
                <label>多模态</label>
                <label class="check"><input id="vision" type="checkbox" checked /> 模型支持视觉，发送网页截图</label>
              </div>
            </div>
          </section>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="cancel-settings">取消</button>
          <button type="submit" class="btn btn-primary" id="save-settings" value="save">保存设置</button>
        </div>
      </form>
    </dialog>

    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
  </body>
</html>
